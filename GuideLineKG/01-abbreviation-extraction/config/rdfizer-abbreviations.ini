; SDM-RDFizer config for mappings/mapping-abbreviations.rml.ttl.
; Same installed version/keys as kg_build/config/rdfizer.ini - see that
; file's header comment for the version-specific notes (ordered: yes,
; PYTHONUTF8=1, etc.), which apply here too.
;
; Run from 01-abbreviation-extraction/ :
;   python src/stage_abbreviations.py output/merged_abbreviations.json -o output/abbreviations.json
;   PYTHONUTF8=1 python -m rdfizer -c config/rdfizer-abbreviations.ini

[datasets]
number_of_datasets: 1
all_in_one_file: yes
name: knowledge_graph_abbreviations
remove_duplicate: yes
enrichment: no
output_folder: output
output_format: n-triples
ordered: yes

[dataset1]
name: knowledge_graph_abbreviations
mapping: mappings/mapping-abbreviations.rml.ttl
