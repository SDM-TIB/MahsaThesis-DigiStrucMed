; SDM-RDFizer config for the version installed in this environment
; (python -m pip show rdfizer -> rdfizer 4.7.5.14, https://github.com/SDM-TIB/SDM-RDFizer).
; Keys verified against the installed package's semantify() implementation
; (rdfizer/semantify.py) rather than guessed.
;
; Run from the OUTPUT_DIR (kg_build/) so the relative "data/..." mapping
; sources resolve correctly:
;   python -m rdfizer -c config/rdfizer.ini

[datasets]
number_of_datasets: 1
all_in_one_file: yes
name: knowledge_graph
remove_duplicate: yes
enrichment: no
output_folder: output
output_format: n-triples
ordered: yes

[dataset1]
name: knowledge_graph
mapping: mappings/mapping.rml.ttl
