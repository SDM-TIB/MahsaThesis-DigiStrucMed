; SDM-RDFizer config for the JSON-direct mapping (mappings/mapping-json.rml.ttl).
; Same installed version/keys as config/rdfizer.ini - see that file's header
; comment for the version-specific notes (ordered: yes, PYTHONUTF8=1, etc.),
; which apply here too.
;
; Run from kg_build/ :
;   PYTHONUTF8=1 python -m rdfizer -c config/rdfizer-json.ini
;   python src/enrich_json_types.py output_json/knowledge_graph_json.nt

[datasets]
number_of_datasets: 1
all_in_one_file: yes
name: knowledge_graph_json
remove_duplicate: yes
enrichment: no
output_folder: output_json
output_format: n-triples
ordered: yes

[dataset1]
name: knowledge_graph_json
mapping: mappings/mapping-json.rml.ttl
