; SDM-RDFizer config for mappings/mapping-wikidata-entities.rml.ttl.
; Same installed version/keys as config/rdfizer-json.ini - see that
; file's header comment for the version-specific notes (ordered: yes,
; PYTHONUTF8=1, etc.), which apply here too.
;
; Run from 02-wikidata-enrichment/ :
;   $env:PYTHONUTF8 = "1"
;   py -3.12 -m rdfizer -c config/rdfizer-wikidata-entities.ini

[datasets]
number_of_datasets: 1
all_in_one_file: yes
name: knowledge_graph_wikidata_entities
remove_duplicate: yes
enrichment: no
output_folder: wikidata_search
output_format: n-triples
ordered: yes

[dataset1]
name: knowledge_graph_wikidata_entities
mapping: mappings/mapping-wikidata-entities.rml.ttl
