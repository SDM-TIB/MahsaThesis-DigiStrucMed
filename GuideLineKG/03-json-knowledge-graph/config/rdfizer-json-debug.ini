; SDM-RDFizer config for debugging ONE file in isolation (see
; "Debugging one file in isolation" in ../README.md). Same mapping as
; config/rdfizer-json.ini, but writes to a different output name
; (output_json/debug_single_file.nt) - the real config's output name
; (knowledge_graph_json) collides with the shared combined graph
; run_json_batch.py writes, and this debug workflow copies its one input
; file straight into mappings/level4.json outside of run_json_batch.py's
; per-file temp-directory isolation, so running it against the real config
; would silently overwrite the real combined graph with one stale file's
; data (this bit this project's own pipeline runs more than once).
;
; Run from 03-json-knowledge-graph/ :
;   PYTHONUTF8=1 python -m rdfizer -c config/rdfizer-json-debug.ini
;   python src/rescope_json_ids.py output_json/debug_single_file.nt
;   python src/enrich_json_types.py output_json/debug_single_file.nt

[datasets]
number_of_datasets: 1
all_in_one_file: yes
name: debug_single_file
remove_duplicate: yes
enrichment: no
output_folder: output_json
output_format: n-triples
ordered: yes

[dataset1]
name: debug_single_file
mapping: mappings/mapping-json.rml.ttl
