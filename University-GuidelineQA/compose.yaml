name: university-guidelineqa
services:
  guidelineqa:
    # Pinned release b11429. Tag form lets a saved image load fully offline.
    # Verified source digest: sha256:2f8ebc2dde83c4bd7e5c6d61efa57965e0d5a79d29802c246c4593740d9c04c1
    image: ghcr.io/ggml-org/llama.cpp:server-b11429
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-7860}:8080"
    volumes:
      - ./models:/models:ro
      - ./web:/web:ro
    command:
      - --model
      - /models/${MODEL_FILE:-Llama-GuidelineKG-1B-Q8_0.gguf}
      - --alias
      - guidelinekg
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --path
      - /web
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "${CPU_THREADS:-4}"
      - --threads-batch
      - "${CPU_THREADS:-4}"
      - --n-gpu-layers
      - "0"
      - --predict
      - "512"
      - --temp
      - "0"
      - --repeat-penalty
      - "1.3"
      - --jinja
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
